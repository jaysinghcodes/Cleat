name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ICS
        run: |
          python -m pip install -r packages/domain/requirements.txt
          python packages/domain/scripts/verify-ics.py docs/qa/ticket-6/sample-session.ics docs/qa/ticket-6/downloaded-session.ics
          python packages/domain/scripts/verify-ics.py packages/domain/scripts/fixtures/utf8-fold.ics
