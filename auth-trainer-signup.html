<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer signup — Cleat</title>
  <link rel="stylesheet" href="shared.css" />
  
</head>
<body>
  <div class="wf-label">
    <span>Auth · Trainer signup</span>
    <span>
      <span class="tag">Responsive web</span>
      &nbsp;<button class="theme-toggle" data-theme-label onclick="toggleCleatTheme()">Dark</button>
      &nbsp;<a href="index.html">Index</a>
    </span>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="lockup"><img src="assets/cleat-mark-charcoal.png" alt="" /><span>Cleat</span></div>
      <h1>Create your desk</h1>
      <p class="lede">For coaches · start with up to 10 clients free</p>
      <div class="field"><label>Full name</label><input value="Alex Rivera" /></div>
      <div class="field"><label>Work email</label><input type="email" value="alex@riverastrength.com" /></div>
      <div class="field"><label>Gym / brand name</label><input value="Rivera Strength" /></div>
      <div class="field"><label>Password</label><input type="password" value="••••••••••" /></div>
      <a class="btn btn-primary btn-lg" href="trainer-accountability.html">Create account</a>
      <div class="auth-foot">Already have an account? <a href="auth-trainer-login.html">Log in</a></div>
    </div>
  </div>
  <script src="shared.js"></script>
</body>
</html>
