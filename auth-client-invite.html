<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client invite · Cleat</title>
  <link rel="stylesheet" href="shared.css" />
  
</head>
<body>
  <div class="wf-label">
    <span>Auth · Client invite accept / join</span>
    <span>
      <span class="tag">Responsive web</span>
      &nbsp;<button class="theme-toggle" data-theme-label onclick="toggleCleatTheme()">Dark</button>
      &nbsp;<a href="index.html">Index</a>
    </span>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="lockup"><img src="assets/cleat-mark-charcoal.png" alt="" /><span>Cleat</span></div>
      <h1>Join Alex’s roster</h1>
      <p class="lede">You’ve been invited to Cleat by <strong>Alex Rivera · Rivera Strength</strong></p>
      <div class="card card-sm callout" style="margin-bottom:18px">
        <div class="row">
          <div class="avatar lg">AR</div>
          <div><div class="name">Alex Rivera</div><div class="meta">Invite expires in 6 days</div></div>
        </div>
      </div>
      <div class="field"><label>Your name</label><input value="Sam Lee" /></div>
      <div class="field"><label>Email</label><input type="email" value="sam@email.com" /></div>
      <div class="field"><label>Create password</label><input type="password" value="••••••••••" /></div>
      <a class="btn btn-primary btn-lg" href="client-today.html">Accept &amp; open app</a>
      <div class="auth-foot">Already joined? <a href="auth-client-login.html">Log in</a></div>
    </div>
  </div>
  <script src="shared.js"></script>
</body>
</html>
