<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log sets · Cleat</title>
  <link rel="stylesheet" href="shared.css" />
  
</head>
<body>
  <div class="wf-label">
    <span>Client · Log sets / weights</span>
    <span>
      <span class="tag">Phone 390×844</span>
      &nbsp;<button class="theme-toggle" data-theme-label onclick="toggleCleatTheme()">Dark</button>
      &nbsp;<a href="index.html">Index</a>
    </span>
  </div>
  <div class="phone-stage">
    <div>
      
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-status"><span>9:41</span><span>●●● 5G ▮</span></div>
        <div class="phone-body">
        <div class="row" style="margin-bottom:8px">
          <a href="client-today.html" class="meta">← Today</a>
        </div>
        <div class="m-title" style="font-size:22px">Romanian deadlift</div>
        <div class="m-sub">3 × 8 · RPE ~7 · rest 90s</div>
        <div class="card callout" style="margin-bottom:14px">
          <div class="meta" style="color:var(--accent-text);line-height:1.45">Alex note: Soft knee bend, hinge from hips. Stop if sharp pain. Message me.</div>
        </div>
        <div class="card" style="padding:16px;margin-bottom:16px">
          <div class="set-row" style="border:none;padding:4px 0;font-size:11px;color:var(--faint);font-weight:600">
            <div>SET</div><div style="text-align:center">LBS</div><div style="text-align:center">REPS</div><div></div>
          </div>
          <div class="set-row"><div style="text-align:center;font-weight:600;color:var(--sub)">1</div><input value="95" /><input value="8" /><div class="check on"></div></div>
          <div class="set-row"><div style="text-align:center;font-weight:600;color:var(--sub)">2</div><input value="95" /><input value="8" /><div class="check"></div></div>
          <div class="set-row" style="border:none"><div style="text-align:center;font-weight:600;color:var(--sub)">3</div><input value="95" /><input value="8" /><div class="check"></div></div>
        </div>
        <div class="field"><label>Optional note</label><input placeholder="Felt strong / form cue…" /></div>
        <button class="btn btn-primary btn-lg">Save sets</button>
        <button class="btn btn-ghost btn-lg" style="margin-top:8px">Mark exercise done</button>
</div>
      <div class="phone-tabs">
        <a class="active" href="client-today.html"><div class="ico">●</div>Today</a>
        <a  href="client-program.html"><div class="ico">▦</div>Program</a>
        <a  href="client-chat.html"><div class="ico">◎</div>Chat</a>
        <a  href="client-book.html"><div class="ico">◌</div>Book</a>
        <a  href="client-profile.html"><div class="ico">○</div>Me</a>
      </div>
      </div>
    </div>
  </div>
  <script src="shared.js"></script>
</body>
</html>
